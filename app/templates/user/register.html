{% extends "user/base.html" %}
{% block title %}Register — Smart Retail{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">Smart Retail</div>
    <div class="auth-tagline">Create your account — it's free</div>

    <form method="POST">
      <div class="mb-3">
        <label class="lux-label">Full Name</label>
        <input type="text" name="name" class="lux-input" required placeholder="Jane Doe" autofocus>
      </div>
      <div class="mb-3">
        <label class="lux-label">Email Address</label>
        <input type="email" name="email" class="lux-input" required placeholder="you@example.com">
      </div>
      <div class="mb-4">
        <label class="lux-label">Password</label>
        <input type="password" name="password" class="lux-input" required placeholder="Min 6 characters" minlength="6">
      </div>
      <button type="submit" class="btn-luxury" style="width:100%;padding:13px;font-size:15px;justify-content:center">
        Create Account
      </button>
    </form>

    <div class="auth-divider">or</div>

    <div style="text-align:center;font-size:13.5px;color:var(--secondary-text)">
      Already have an account?
      <a href="{{ url_for('user.login') }}" style="color:var(--accent);font-weight:600;text-decoration:none">Sign In →</a>
    </div>
  </div>
</div>
{% endblock %}
