#CI
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-secret
      AI_MODE: mock
      DATABASE_URL: "sqlite:///retail.db"
      FLASK_ENV: development
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint and Compile
        run: python -m compileall -q app config.py run.py init_db.py

      - name: Test App Factory
        run: python -c "from app import create_app; create_app(); print('App initialized successfully')"