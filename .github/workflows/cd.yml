name: CD

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deploy target
        required: false
        default: production

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - run: echo "deploy target=${{ github.event.inputs.environment }}"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Package app
        run: zip -r release.zip . -x '*.git*' -x '*venv*' -x '*.pyc' -x '__pycache__/*'
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle
          path: release.zip
